[package]
name = "wechat-mp-desktop"
version = "1.0.0"
description = "智序：面向公众号创作者的本地桌面写作与排版工作台"
authors = ["CH3SH-LC"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wechat_mp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# net/io-util 供 tests 里的"可控假 HTTP 服务"使用（阶段 6：延迟/超时/错误/取消）
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[features]
# 仅供**真机验收驱动**使用：打开 WebView2 DevTools（等价于允许 CDP 远程调试端口）。
#
# 为什么需要它：Tauri/wry 在 release 构建里把 `devtools` 默认关掉（wry `src/lib.rs` 的
# `devtools: cfg!(debug_assertions)`），随后 `webview2/mod.rs` 会执行
# `settings.SetAreDevToolsEnabled(false)`——宿主自己把 DevTools 关了，于是即使
# `--remote-debugging-port` 确实出现在 WebView2 子进程命令行上，端口也不会被监听
# （2026-10-02 零调用矩阵实测：应用侧 `tcp-econnrefused`，同机普通 Edge 用同一开关可用）。
#
# **默认关闭**：发布产物的行为与体积完全不变，绝不带 DevTools。
# 用法（只在验收时）：`pnpm tauri build --no-bundle -f acceptance-devtools`
acceptance-devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
regex = "1"
base64 = "0.22"
# sync: 取消信号（watch）；time: 超时与假服务延迟；macros: tokio::select!。tauri 本身已依赖 tokio。
tokio = { version = "1", features = ["sync", "time", "macros"] }
# sha2: 不可变版本的文件哈希（§7.2 提交校验 + 读取时完整性比对）。锁文件里早就有了（传递依赖），
# 这里只是把它提成直接依赖，不引入新的包。
sha2 = "0.10"
# R32: decode and validate local originals, then make a separate bounded model preview.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
# Already present through Tauri/Wry; explicit access is needed for ProcessFailed.
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging"] }
